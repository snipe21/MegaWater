<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>WaterFlow</title>
  <link rel="manifest" id="pwa-manifest" href="/manifest.json" />
  <meta name="theme-color" content="#2dd4a7" />
  <script>
    // Point the manifest link at a role-specific file *before* the browser
    // evaluates installability, so installing from /tenant, /admin, or
    // /super each produces its own home-screen icon with the correct
    // start_url - instead of every install sharing one manifest that
    // always launches at "/" (which defaults to the admin portal).
    (function () {
      var seg = window.location.pathname.split("/").filter(Boolean)[0];
      var file = seg === "super" ? "/manifest-super.json"
        : seg === "tenant" ? "/manifest-tenant.json"
        : seg === "admin" ? "/manifest-admin.json"
        : "/manifest.json";
      document.getElementById("pwa-manifest").setAttribute("href", file);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app"></div>
  <script src="/app.js"></script>
</body>
</html>

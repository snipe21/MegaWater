name: "WaterFlow Water Metering"
version: "0.2.0"
slug: "waterflow"
description: "Multi-tenant LoRaWAN water metering, billing, and reporting via ChirpStack"
url: "https://github.com/snipe21/MegaWater"
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
ports:
  8000/tcp: 8000
ports_description:
  8000/tcp: "WaterFlow web interface (Super Admin / Admin / Tenant PWAs)"

options:
  product_name: "WaterFlow"
  building_name: ""
  super_admin_app_name: "WaterFlow Super Admin"
  admin_app_name: "WaterFlow Admin"
  tenant_app_name: "WaterFlow"
  super_admin_password: ""
  chirpstack_mqtt_host: ""
  chirpstack_mqtt_port: 1883
  chirpstack_mqtt_user: ""
  chirpstack_mqtt_pass: ""
  chirpstack_rest_url: ""
  chirpstack_api_key: ""
  chirpstack_region: "EU868"
  chirpstack_tenant_name: ""
  domain_name: ""
  enable_ha_mqtt_discovery: false
  ha_mqtt_host: "core-mosquitto"
  ha_mqtt_port: 1883
  ha_mqtt_user: ""
  ha_mqtt_pass: ""
  smtp_host: ""
  smtp_port: 587
  smtp_user: ""
  smtp_pass: ""
  smtp_from: ""
  telegram_bot_token: ""
  telegram_audit_chat_id: ""
  telegram_digest_chat_id: ""
  digest_send_time: "08:00"

schema:
  product_name: "str"
  building_name: "str"
  super_admin_app_name: "str"
  admin_app_name: "str"
  tenant_app_name: "str"
  super_admin_password: "password"
  chirpstack_mqtt_host: "str"
  chirpstack_mqtt_port: "port"
  chirpstack_mqtt_user: "str?"
  chirpstack_mqtt_pass: "password?"
  chirpstack_rest_url: "url"
  chirpstack_api_key: "password"
  chirpstack_region: "list(EU868|US915|AU915|AS923|IN865|CN470|KR920|RU864)"
  chirpstack_tenant_name: "str"
  domain_name: "str?"
  enable_ha_mqtt_discovery: "bool"
  ha_mqtt_host: "str?"
  ha_mqtt_port: "port?"
  ha_mqtt_user: "str?"
  ha_mqtt_pass: "password?"
  smtp_host: "str?"
  smtp_port: "port?"
  smtp_user: "str?"
  smtp_pass: "password?"
  smtp_from: "str?"
  telegram_bot_token: "password?"
  telegram_audit_chat_id: "str?"
  telegram_digest_chat_id: "str?"
  digest_send_time: "str"

map:
  - "share:rw"
